<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POC Deck — Long-Lived Collaborating Agents</title>
    <link rel="stylesheet" href="./node_modules/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="./node_modules/reveal.js/dist/reveal.css" />
    <style>
      html { font-size: 16px; }
      .reveal .slides { text-align: left; }
      .reveal ul, .reveal ol { display: block; margin-left: 1.2em; }
      .reveal code { padding: 0.1em 0.25em; border-radius: 4px; }
    </style>
    <!-- Active custom theme. Swap this href to try a different theme from assets/themes/. -->
    <link rel="stylesheet" href="./assets/themes/theme-01-midnight-blueprint.css" id="custom-theme" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="slides.md"
          data-separator="^---\s*$"
          data-separator-vertical="^--\s*$"
          data-separator-notes="^Note:"
        ></section>
      </div>
    </div>

    <script src="./node_modules/reveal.js/dist/reveal.js"></script>
    <script src="./node_modules/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="./node_modules/reveal.js/plugin/notes/notes.js"></script>
    <script src="./reveal.config.js"></script>
    <script>
      const config = window.POC_REVEAL_CONFIG || {};
      Reveal.initialize({
        ...config,
        plugins: [RevealMarkdown, RevealNotes]
      });
    </script>
  </body>
</html>
